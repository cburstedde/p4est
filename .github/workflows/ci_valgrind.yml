name: CI for valgrind

on:
  push:
    paths:
      - "src/*.c"
      - "test/*.c"
      - ".github/workflows/ci_valgrind.yml"

env:
  # Due to busy file system problems on the CI runners,
  # we deactivate the file checks in the CI.
  P4EST_CI_CONFIG_OPT_AC: --disable-file-checks
  P4EST_CI_CONFIG_OPT_CMAKE: -DP4EST_ENABLE_FILE_CHECKS=OFF -DSC_ENABLE_FILE_CHECKS=OFF

jobs:

  linux-autotools-valgrind:
    runs-on: ubuntu-latest
    name: Autotools with valgrind
    steps:

    - name: Install system dependencies
      run: |
        sudo apt-get update -yq
        sudo apt-get install -yq --no-install-recommends \
            zlib1g-dev valgrind-mpi

    - name: Download and install custom MPI environment
      shell: bash
      run: |
        MPIPREFIX="/usr/local/mpich"
        wget https://www.mpich.org/static/downloads/3.4.3/mpich-3.4.3.tar.gz
        tar -xvzf mpich-3.4.3.tar.gz && cd mpich-3.4.3
        ./configure --enable-g=most,meminit --with-device=ch3 \
                    --disable-fortran --disable-cxx --prefix="$MPIPREFIX"
        make -j16
        sudo make -j install

    - name: Checkout source code
      uses: actions/checkout@main
      with:
        submodules: true

    - name: Run bootstrap script
      run: ./bootstrap

    - name: Make check with MPI and valgrind, without shared
      shell: bash
      run: |
        MPIPREFIX=/usr/local/mpich
        export PATH="$MPIPREFIX/bin:$PATH"
        export LD_LIBRARY_PATH="$MPIPREFIX/lib"
        mpirun --version
        DIR="checkMPIvalgrind" && mkdir -p "$DIR" && cd "$DIR"
        ../configure --enable-mpi --disable-shared --enable-valgrind \
                     CFLAGS="-O2 -Wall -Wextra -Wno-unused-parameter"
        make -j V=0
        make -j4 check V=0

    - name: Upload log files
      if: always()
      uses: actions/upload-artifact@main
      with:
        name: linux_autotools_valgrind_log
        path: |
          ./**/config.log
          ./**/test-suite.log
          ./**/test/*.log

  linux-cmake-valgrind:
    runs-on: ubuntu-latest
    name: CMake with valgrind
    steps:

    - name: Install system dependencies
      run: |
        sudo apt-get update -yq
        sudo apt-get install -yq --no-install-recommends \
            zlib1g-dev libmpich-dev mpich valgrind-mpi

    - name: Checkout source code
      uses: actions/checkout@main
      with:
        submodules: true

    - name: CMake build with MPI and valgrind
      shell: bash
      run: |
        DIR="checkCMakeMPIvalgrind" && mkdir -p "$DIR" && cd "$DIR"
        cmake -Dmpi=yes -DCMAKE_BUILD_TYPE=Release $P4EST_CI_CONFIG_OPT_CMAKE ..
        cmake --build . --parallel
        ctest . -T memcheck

    - name: Upload log files
      if: always()
      uses: actions/upload-artifact@main
      with:
        name: linux_cmake_valgrind_log
        path: |
          ./checkCMakeMPIvalgrind/Testing/Temporary
